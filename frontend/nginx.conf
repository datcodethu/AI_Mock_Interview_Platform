server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mọi route không khớp file tĩnh đều trả về index.html,
    # để react-router tự xử lý routing phía client — thiếu dòng này,
    # F5 ở route con (VD /admin/users) sẽ bị lỗi 404 từ chính Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}